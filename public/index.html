<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specter</title>
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:title" content="Specter">
<meta property="og:description" content="현실적인 판단으로 업무를 돕는 AI">
<meta property="og:image" content="https://specter-js8n.onrender.com/og-image.png">
<meta property="og:url" content="https://specter-js8n.onrender.com">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark"><img src="logo.png" alt="Specter"></span>
      <h1>Specter</h1>
    </div>
    <button id="new-project-btn" class="new-project-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      새 프로젝트
    </button>
    <nav id="project-list" class="project-list"></nav>
    <div class="sidebar-footer">
      <span id="user-email" class="user-email"></span>
      <div class="sidebar-footer-links">
        <a href="/settings.html" class="logout-link">설정</a>
        <button id="logout-btn" class="logout-link">로그아웃</button>
      </div>
    </div>
  </aside>

  <div class="app">
    <main id="chat" class="chat"></main>

    <form id="composer" class="composer">
      <textarea id="input" placeholder="대화를 시작해보세요" rows="1"></textarea>
      <button type="submit" id="send-btn" aria-label="전송">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
