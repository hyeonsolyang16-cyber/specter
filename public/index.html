<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specter</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Specter">
<meta name="theme-color" content="#344E41">
<meta property="og:title" content="Specter">
<meta property="og:description" content="현실적인 판단으로 업무를 돕는 AI">
<meta property="og:image" content="https://specter-js8n.onrender.com/og-image.png">
<meta property="og:url" content="https://specter-js8n.onrender.com">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark"><img src="logo.png" alt="Specter"></span>
      <h1>Specter</h1>
    </div>
    <button id="new-project-btn" class="new-project-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      새 프로젝트
    </button>
    <input id="search-input" class="search-input" type="search" placeholder="대화 검색">
    <nav id="project-list" class="project-list"></nav>
    <div class="sidebar-footer">
      <span id="user-email" class="user-email"></span>
      <div class="sidebar-footer-links">
        <a href="/settings.html" class="logout-link">설정</a>
        <button id="logout-btn" class="logout-link">로그아웃</button>
      </div>
      <button id="install-btn" class="logout-link" hidden>앱으로 설치</button>
    </div>
  </aside>

  <div class="app">
    <div class="mobile-topbar">
      <button id="menu-btn" class="menu-btn" aria-label="메뉴">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="mobile-topbar-title">Specter</span>
    </div>
    <main id="chat" class="chat"></main>

    <form id="composer" class="composer">
      <div id="attachment-preview" class="attachment-preview"></div>
      <div class="composer-row">
        <button type="button" id="attach-btn" class="attach-btn" aria-label="파일 첨부">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" accept="image/*" multiple hidden>
        <textarea id="input" placeholder="Specter에게 물어보세요" rows="1"></textarea>
        <button type="submit" id="send-btn" aria-label="전송">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>
        </button>
      </div>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
