<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 - Specter</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Specter">
<meta name="theme-color" content="#344E41">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <form id="forgot-form" class="auth-card">
    <span class="brand-mark auth-logo"><img src="logo.png" alt="Specter"></span>
    <h1>비밀번호 찾기</h1>
    <label>가입한 이메일
      <input type="email" id="email" required autocomplete="email">
    </label>
    <p id="error" class="auth-error"></p>
    <p id="success" class="settings-success"></p>
    <button type="submit">재설정 링크 받기</button>
    <p class="auth-switch"><a href="login.html">로그인으로 돌아가기</a></p>
  </form>
</div>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  errorEl.textContent = '';
  successEl.textContent = '';
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || '요청에 실패했습니다.';
      return;
    }
    successEl.textContent = data.message || '이메일을 확인해주세요.';
  } catch (err) {
    errorEl.textContent = '서버에 연결할 수 없습니다.';
  }
});
</script>
</body>
</html>
