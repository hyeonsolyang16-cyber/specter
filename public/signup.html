<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - Specter</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Specter">
<meta name="theme-color" content="#344E41">
<meta property="og:title" content="Specter">
<meta property="og:description" content="현실적인 판단으로 업무를 돕는 AI">
<meta property="og:image" content="https://specter-js8n.onrender.com/og-image.png">
<meta property="og:url" content="https://specter-js8n.onrender.com/signup.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <form id="signup-form" class="auth-card">
    <span class="brand-mark auth-logo"><img src="logo.png" alt="Specter"></span>
    <h1>회원가입</h1>
    <label>이메일
      <input type="email" id="email" required autocomplete="email">
    </label>
    <label>비밀번호 (8자 이상)
      <input type="password" id="password" required minlength="8" autocomplete="new-password">
    </label>
    <p id="error" class="auth-error"></p>
    <button type="submit">회원가입</button>
    <div class="auth-divider">또는</div>
    <a href="/auth/google" class="oauth-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.27 6.62l4 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
      구글로 계속하기
    </a>
    <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
  </form>
</div>
<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || '회원가입에 실패했습니다.';
      return;
    }
    location.href = '/';
  } catch (err) {
    errorEl.textContent = '서버에 연결할 수 없습니다.';
  }
});
</script>
</body>
</html>
