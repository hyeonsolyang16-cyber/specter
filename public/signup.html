<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - Specter</title>
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:title" content="Specter">
<meta property="og:description" content="현실적인 판단으로 업무를 돕는 AI">
<meta property="og:image" content="https://specter-js8n.onrender.com/og-image.png">
<meta property="og:url" content="https://specter-js8n.onrender.com/signup.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <form id="signup-form" class="auth-card">
    <span class="brand-mark auth-logo"><img src="logo.png" alt="Specter"></span>
    <h1>회원가입</h1>
    <label>이메일
      <input type="email" id="email" required autocomplete="email">
    </label>
    <label>비밀번호 (8자 이상)
      <input type="password" id="password" required minlength="8" autocomplete="new-password">
    </label>
    <p id="error" class="auth-error"></p>
    <button type="submit">회원가입</button>
    <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
  </form>
</div>
<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || '회원가입에 실패했습니다.';
      return;
    }
    location.href = '/';
  } catch (err) {
    errorEl.textContent = '서버에 연결할 수 없습니다.';
  }
});
</script>
</body>
</html>
