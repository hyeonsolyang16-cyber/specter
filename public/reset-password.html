<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 - Specter</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Specter">
<meta name="theme-color" content="#344E41">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <form id="reset-form" class="auth-card">
    <span class="brand-mark auth-logo"><img src="logo.png" alt="Specter"></span>
    <h1>비밀번호 재설정</h1>
    <label>새 비밀번호 (8자 이상)
      <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
    </label>
    <p id="error" class="auth-error"></p>
    <button type="submit">비밀번호 변경</button>
    <p class="auth-switch"><a href="login.html">로그인으로 돌아가기</a></p>
  </form>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
const errorEl = document.getElementById('error');
if (!token) errorEl.textContent = '유효하지 않은 링크입니다. 비밀번호 찾기를 다시 요청해주세요.';

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  if (!token) return;
  const newPassword = document.getElementById('new-password').value;
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || '재설정에 실패했습니다.';
      return;
    }
    location.href = '/login.html';
  } catch (err) {
    errorEl.textContent = '서버에 연결할 수 없습니다.';
  }
});
</script>
</body>
</html>
